services:
  - type: web
    name: fb-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FETCH_INTERVAL_MINUTES
        value: "30"
      - key: WEBHOOK_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
